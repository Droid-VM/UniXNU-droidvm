# Device repository of a DroidVM guest: crosvm on the Gunyah hypervisor of a Snapdragon phone.
# The firmware is DroidVM's own edk2-gunyah, not a Mu-Silicium port, so this board has no [firmware]
# or [bootimg] step: UniXNU.efi and DarwinBoot.efi start from a FAT disk attached to the VM.

[board]
name = "droidvm"
soc = "crosvm-gunyah"
description = "DroidVM guest (crosvm on Gunyah)"
kit = "droidvm"

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "droidvm_defconfig"
# Archive builders of the kernel step, in order (a subset of sheng's: no UFS, PMGR, Adreno or display).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  # Storage, display and HID bind to original prelinked classes. Their audits read a reference candidate:
  # build/reference-candidate/kernel.{macho,json}, a prelinked kernel of this board built WITHOUT
  # CONFIG_XNU_NATIVE_VIRTIO_BLOCK / RAM_BLOCK / LEGACY_DISPLAY (original kext addresses do not move between
  # builds). A build from scratch therefore links one such kernel first and copies it there.
  "audit-storage-interface-static.py",
  # Owner root: OS + SystemOS policies (build-owner-os-policy.py, build-owner-systemos-policy.py) must exist.
  "build-verified-root-probe.py --component os --include-systemos",
  "build-arm-driver.py NativeVirtioBlock --verified-root --verified-root-bundle",
  "build-native-virtio-bindings.py --component NativeVirtioBlock --directory build/native-virtio-block-verified-bundle",
  "build-arm-driver.py NativeRamBlock",
  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  "build-libpthread-kernel.py",
  "build-native-legacy-display.py",
]

[kernel.prelink]
# The same target kernelcache as sheng (iPad7,1 iPadOS 17.7.11), so the same pins and roots.
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The FAT volume attached to the VM as a disk: UniXNU's config, the kernel, its device tree, the trust caches
# and the packed Data seed. loader = "driver" makes UniXNU load Payloads/DarwinBoot.efi itself, since
# edk2-gunyah does not carry it. Build with:
#   unixnu build payload --trust-cache <tree>/build/original-static-system-trust/original-static-system.bundle \
#     --data-ramdisk <tree>/build/droidvm-data/data-2g-skip.dbr --unique-chip-id <16 hex digits>
[payload]
volume = "DROIDVMESP"
size_mib = 192
loader = "driver"
title = "DroidVM: iPadOS 17.7.11, CPU-rendered desktop"
dram_size = "0x13f600000"            # guest RAM of the 5120 MiB pseudo-unprotected VM: "SHIM: /memory now 0x80600000+0x13f600000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
]
kernel_args = [
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "-apfs_shared_datavolume",
  "offline-apfs-load=1",
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=1",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-phase=4",
  "offline-legacy-unit-scale=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-hid-input=1",
  "offline-hid-home=1",
  "sheng-touch-hid=1",
  "offline-key-events=1",
  "sheng-aks=1",
  "armcpu-diagnostics=1",
  "sheng-smp=1",
  "droidvm-monitor=1000",            # process samples for the host rig (kits/droidvm/DroidVMStubs.c)
  # launchd jobs this platform cannot serve (kits/droidvm/DroidVMLaunchPolicy.c): no watchdog backend, and the services
  # sheng found in a cycle of synchronous XPC waits on first boot (UniXNU docs/guide/skip-setup.md)
  "droidvm-disable-jobs=com.apple.watchdogd,com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd",
]

[payload.adt]
tool = "scripts/make-droidvm-adt.py"
dram_base = "0x80600000"             # the shim's RAM window; crosvm's own FDT lists only the boot region
owned_memory_size = "0xb0000000"     # 2.75 GiB DarwinBoot window: the RAM run above 4 GiB of the 5 GiB VM
cpu_regs = "0,1,2,3"                 # the VM's 4 vCPUs (crosvm MPIDRs); ArmCpu starts the secondaries with PSCI CPU_ON (sheng-smp=1)
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the original OS volume
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"
chip_id = "8011"                     # iPad7,1 (A10X), as board [ipsw] chip_id
