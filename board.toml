# Device repository of a DroidVM guest: crosvm on the Gunyah hypervisor of a Snapdragon phone.
# The firmware is DroidVM's own edk2-gunyah, not a Mu-Silicium port, so this board has no [firmware]
# or [bootimg] step: UniXNU.efi and DarwinBoot.efi start from a FAT disk attached to the VM.

[board]
name = "droidvm"
soc = "crosvm-gunyah"
description = "DroidVM guest (crosvm on Gunyah)"
kit = "droidvm"

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppOS", "Cryptex1,AppTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "droidvm_defconfig"
# Archive builders of the kernel step, in order (a subset of sheng's: no UFS, PMGR, Adreno or display).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  # Storage, display and HID bind to original prelinked classes. Their audits read a reference candidate:
  # build/reference-candidate/kernel.{macho,json}, a prelinked kernel of this board built WITHOUT
  # CONFIG_XNU_NATIVE_VIRTIO_BLOCK / RAM_BLOCK / LEGACY_DISPLAY (original kext addresses do not move between
  # builds). A build from scratch therefore links one such kernel first and copies it there.
  "audit-storage-interface-static.py",
  # Owner root: OS + SystemOS policies (build-owner-os-policy.py, build-owner-systemos-policy.py) must exist.
  "build-verified-root-probe.py --component os --include-systemos",
  "build-arm-driver.py NativeVirtioBlock --verified-root --verified-root-bundle",
  "build-native-virtio-bindings.py --component NativeVirtioBlock --directory build/native-virtio-block-verified-bundle",
  "build-arm-driver.py NativeRamBlock",
  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  "build-libpthread-kernel.py",
  # The paravirtual Adreno over crosvm's droidvm-gpu device (the host's KGSL); its objects ride in the display archive below.
  "build-droidvm-gpu.py",
  "build-native-legacy-display.py",
]

[kernel.prelink]
# The same target kernelcache as sheng (iPad7,1 iPadOS 17.7.11), so the same pins and roots.
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The FAT volume attached to the VM as a disk: UniXNU's config, the kernel, its device tree, the trust caches
# and the packed Data seed. loader = "driver" makes UniXNU load Payloads/DarwinBoot.efi itself, since
# edk2-gunyah does not carry it. Build with:
#   unixnu build payload --trust-cache <tree>/build/original-static-system-trust/original-static-system.bundle \
#     --data-ramdisk <tree>/build/droidvm-data/data-2g-skip.dbr --unique-chip-id <16 hex digits>
[payload]
volume = "DROIDVMESP"
size_mib = 192
loader = "driver"
title = "DroidVM: iPadOS 17.7.11, CPU-rendered desktop"
# guest RAM of the 5120 MiB pseudo-unprotected VM: "GH-SHIM: window gpa=0x80600000 size=0x13f200000". The VM's
# --pre-alloc drm-host-mb=8 takes 8 MiB of --mem for drm2kgsl's host pool (0x1bf800000, the FDT's drm2kgsl_host node, published to
# the guest as /arm-io/virtio-gpu drm-host-pool); without it the window is 0x13fa00000. There is no simple framebuffer to take off its
# top any more (virtio-gpu scans out of guest memory); a VM that has one again (screens.simplefb, 6 MiB at 1366x1024) needs 6 MiB less,
# or the panic region lands inside the framebuffer
dram_size = "0x13f200000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
# The original static/System trust caches, and the owner trust bundle built around them with the Adreno Metal plugin's CDHashes
# and droidvm-diag's (scripts/build-droidvm-diag.py; make-owner-trust-bundle.py, it changes with every plugin or tool build).
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "1cb2da3e02d59725f1261b1a47c9f013fec5e5c679d30b68e55061464b4f517f",
]
kernel_args = [
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # no ticket lock timeout (default 0.125 s): a vCPU the busy host does not run for that long held a workqueue lock while another
  # waited, and the waiter panicked the guest
  "tlto_us=0",
  "-apfs_shared_datavolume",
  "offline-apfs-load=1",
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=1",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-phase=4",
  "offline-legacy-unit-scale=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  # NativeLegacyDisplay defaults to sheng-early-retire=0: retain each swap until display DMA completes.
  # Omit the duplicate bootarg to keep the full boot command below DarwinBoot's 1024-byte buffer.

  "offline-hid-input=1",
  "offline-hid-home=1",
  "sheng-touch-hid=1",
  "offline-key-events=1",
  "sheng-aks=1",
  # the keybag of a guest without a passcode: MobileKeyBag "Disabled", so SpringBoard neither revokes authentication at
  # boot nor waits for a passcode that does not exist (default 0 reads as a passcode set and unlocked)
  "sheng-aks-sls=3",
  "armcpu-diagnostics=1",
  "sheng-smp=1",
  "droidvm-monitor=1000",            # process samples for the host rig (kits/droidvm/DroidVMStubs.c)
  # inter-processor interrupts. XNU signals a core (cpu_signal) only once that core has taken its first IPI, and skips it silently
  # until then: without the self-IPI ArmCpu sends from initCPU no core ever got one, so a panic or a stackshot never stopped the
  # other cores (a stackshot raced them and the DEVELOPMENT kernel panicked: "thread wait info count mismatch"), and a core
  # was woken for new work only by its timer. Gunyah drops the SGIs a guest writes to ICC_SGI1R_EL1, so the IPIs are
  # software-pended SPIs, as on sheng
  "armcpu-self-ipi=1",
  "armcpu-spi-ipi=1",
  # the Data disk keeps what the system writes in the store window of the third virtio-mmio disk (kits/droidvm/DroidVMDataStore.c)
  "droidvm-data-persist=2",
  # the deletable system apps (Weather, Calendar, Notes, Maps, ...): the OS volume's /private/var/staged_system_apps as a read-only
  # union view over /Applications, since the Data seed carries no copy for the first boot's migration to install (UniXNU
  # patches/xnu/zzy-union-staged-apps.patch)
  "owner-staged-apps=1",
  # the App cryptex (Safari's daemons, SafariSupport.bundle, Safari's settings pane) from the seed's /private/var/ngpu/preboot shown
  # read-only over /private/preboot, where /System/Cryptexes/App leads (package/DroidVMLaunchPolicy.c, scripts/add-app-cryptex-data.py)
  "owner-app-cryptex=1",
  # /private/var/ngpu/bin shown read-only over /usr/libexec, so launchd's cached job for a daemon there (it ignores the plist
  # file's ProgramArguments) execs our binary of the same basename instead. droidvm-diag rides in as /usr/libexec/remindd
  # (scripts/build-droidvm-diag.py).
  "owner-tools-overlay=1",
  # Our owner-signed binaries are in the trust cache but not platform binaries, so AMFI's launch constraints (which gate a
  # system-service launch on a platform binary) kill them with "Launch Constraint Violation". The original RELEASE AMFI
  # ignores its own amfi_* boot-args, so XNU clears the error itself (patches/xnu/zzy-union-staged-apps.patch). This
  # VM is not a security boundary.
  "owner-skip-launch-constraints=1",
  # the data protection class a caller sets is kept on the unencrypted Data volume (and an unset one reads as class D, "None"):
  # PosterBoard checks its data store's class back and, finding none, had no wallpaper store at all (UniXNU
  # patches/xnu/zzu-dataprotect-without-cprotect.patch)
  "owner-dataprotect=1",
  # start the owner service manager once at boot. launchd takes its jobs from the signed compiled cache and ignores an owner
  # overlay plist's ProgramArguments, and a new label is never enumerated, so no launchd overlay launches an owner binary here;
  # the kernel launch-policy hook posix_spawns /private/var/ngpu/bin/ownervisor itself (kits/droidvm/DroidVMLaunchPolicy.c,
  # scripts/build-droidvm-ownervisor.py, scripts/add-ownervisor-data.py). It brings up the owner debug services and the GPU probe.
  "owner-service-manager=1",
  # launchd jobs this platform cannot serve (kits/droidvm/DroidVMLaunchPolicy.c): no watchdog backend, the services sheng found
  # in a cycle of synchronous XPC waits on first boot (UniXNU docs/guide/skip-setup.md), and fairplayd, which exits at once
  # without the FairPlayIOKit kext (it does not prelink against this kernel); its MachServices stay registered meanwhile, so
  # lockdownd's first FairPlay call waited forever, and with it accountsd and every app that asks it (Notes, Photos stayed blank).
  # A label without a "com." domain is under com.apple. bluetoothd runs: without its MachServices audiomxd's Bluetooth audio plugin
  # retried com.apple.BTAudioHALPlugin.xpc about 110 times a second (95% of the unified log), and it needs only the keychain.
  "droidvm-disable-jobs=watchdogd,identityservicesd,locationd,CommCenter,fairplayd.A2",
  # the host phone's GPU through crosvm --droidvm-gpu (kits/droidvm/DroidVMGpu.cpp): NativeAdreno's service over KGSL
  # (droidvm-gpu-selftest=1 first runs one CP_MEM_WRITE through it; left out, the command line is at its 1000-byte limit)
  "droidvm-gpu=1",
  # Metal's 3D through the virtio GPU's DRM context (drm2kgsl) by default, droidvm-gpu still there: turnip asks the kernel
  # (package/DroidVMVirtioGpu3D.cpp, DROIDVM_VIRTGPU_PARAM_DEFAULT_3D); TU_DARWIN_VIRTGPU=0 or 1 in a process overrides it
  "vgpu-3d=1",
  # the AGXAccelerator for the original Metal discovery, and the plugin bundle (staged in the Data seed by add-gpu-plugin-data.py)
  # mounted over /System/Library/Extensions
  "droidvm-gpu-metal=1",
  "sheng-gpu-addon=1",
  # the processes besides backboardd that get a Metal device of their own (DroidVMLaunchPolicy.c writes the plugin's clients file):
  # WidgetRenderer draws the widgets through RenderBox, and iconservicesagent the app icons, whose CoreImage context otherwise
  # falls back to OpenGL ES and crashes in CI::GLContext on every icon (sheng disables the job); *Poster* ("*X*" names every
  # process whose name holds X) is PosterBoard and each wallpaper's poster extension, which render the wallpaper and the
  # gallery's previews with Metal (AegirPoster, KaleidoscopePoster crashed without a device); and WebKit's processes,
  # com.apple.WebKit.* (a name ending in '*' names every process it begins): CoreGraphics draws a page's wide-color layers
  # ('b3a8', 'w30r') only through the GPU, so without a device WebContent drew nothing into them and Safari's pages were black.
  # Settings (Preferences) reads the wallpaper's snapshot, which PosterBoard writes in its device's texture layout (an ASTC ATX
  # file); ImageIO reads such a file back only through a device's layout, and Settings > Wallpaper trapped on the missing image.
  # The kernel's grant and the plugin take the same forms (UniXNU patch zzw, build-adreno-metal-plugin.py). Maps is not one: VectorKit
  # lost its device (DeviceLost) within seconds, and the render server's frames were wedged until a reboot; without one its map is
  # blank but the app runs. gfxprobe is the rig's probe (`gfxprobe ci` checks Core Image on the device against its software renderer)
  "droidvm-gpu-clients=WidgetRenderer_Default,*Poster*,iconservicesagent,com.apple.WebKit.*,Preferences,MetalCheck,app_ios,gfxprobe",
]

[payload.adt]
tool = "scripts/make-droidvm-adt.py"
dram_base = "0x80600000"             # the shim's RAM window; crosvm's own FDT lists only the boot region
# DarwinBoot's window only holds what it loads (kernel, device tree, Data seed, trust caches); with --reclaim-memory below the kernel
# also gets the RAM after it that the firmware frees at ExitBootServices, up to the panic region at the top of guest RAM. The
# window alone had to fit one free run of the firmware's map, which left the kernel 2.75 GiB of the 5 GiB VM (the run above 4 GiB).
owned_memory_size = "0x20000000"
cpu_regs = "0,1,2,3"                 # the VM's 4 vCPUs (crosvm MPIDRs); ArmCpu starts the secondaries with PSCI CPU_ON (sheng-smp=1)
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the original OS volume
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"
chip_id = "8011"                     # iPad7,1 (A10X), as board [ipsw] chip_id
# The third crosvm --virtio-mmio-block (tools/rig/make-data-store.sh) is the store disk, not a NativeVirtioBlock image;
# --virtio-mmio-input puts the app's four input devices (mouse, multi-touch, absolute mouse, keyboard) after the disks,
# --droidvm-gpu its GPU after them, and --virtio-mmio-net the --net device last (/arm-io/net, package/DroidVMVirtioNet.c).
# --display-gamut sRGB: the display chain scans out 8-bit sRGB (BGRX), and with the panel's P3 every app and WebKit drew its layers
# into wide-color surfaces ('w30r', 'b3a8') that CoreGraphics fills only through the GPU -- which WebKit's sandboxed GPU process
# cannot map -- so Safari's pages stayed black; sRGB keeps them on 8-bit BGRA surfaces CoreGraphics draws on the CPU too.
# --virtio-gpu-mmio: the display (--virtio-mmio-gpu, last), with 8 MiB of RAM DarwinBoot keeps for its BLT-only boot screen.
# package/crosvm-gunyah.dtb is this VM's own FDT, which names that window.
tool_args = ["--data-store-mmio", "0x0a002000", "--input-mmio", "0x0a003000,0x0a004000,0x0a005000,0x0a006000",
             "--gpu-mmio", "0x0a007000", "--net-mmio", "0x0a008000", "--virtio-gpu-mmio", "0x0a009000", "--boot-video-mib", "8",
             "--reclaim-memory", "--display-gamut", "sRGB"]
