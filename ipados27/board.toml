# The DroidVM guest on iPadOS 27.0.1 (24A446, iPad17,3 J820AP, arm64e): the same crosvm-on-Gunyah virtual machine as the iPadOS 17
# board in the directory above (../board.toml), on the layered profiles of UniXNU's schema 2 (profiles/arch/arm64e,
# profiles/os/ipados-27.0.1-24A446, the crosvm-gunyah SoC layer in ../socs). Build it with -D <repo>/ipados27; the iPadOS 17 board
# stays as it is. It shares the device package (package -> ../package). Its scripts/ holds this board's own; those of the
# iPadOS 17 board are not taken (their build-arm-driver.py predates arm64e and would replace the fork's).
#
# Bring-up state (plans/IPADOS27_BUMP.md of the meta repository): the arm64e kernel with the board's XNU changes, the drivers every
# DroidVM guest needs to start (ArmDTPlatform, ArmCpu) and its disks with the owner chain; display and GPU follow.
schema_version = 2

[board]
name = "droidvm"
soc = "crosvm-gunyah"
soc_source = "crosvm-gunyah"
os_profile = "ipados-27.0.1-24A446"
description = "DroidVM guest (crosvm on Gunyah), iPadOS 27"
kit = "droidvm"

# The whole list: a layer's list replaces the one below it (the SoC layer's would drop the arm64e profile's XnuPrelink).
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "VirtioMmioBlock", "RamBlock", "VerifiedRoot", "GopFramebuffer", "AppleKeyStoreState"]

[kernel]
defconfig = "droidvm_ipados27_defconfig"
config_fragments = ["arch:configs/common.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  # Their own archives are not linked (the source storage below compiles both drivers); the catalog requires an entry for every
  # included driver with a build, as sheng's board lists RamBlock.
  "component:VirtioMmioBlock",
  "component:RamBlock",
  # The disks (scripts/build-droidvm-source-storage.py): the public IOBlockStorageDevice, NativeVirtioBlock, NativeRamBlock and the
  # Data store, registered after the original storage family (package/DroidVMSourceStorage.cpp). Needs the owner keys.
  "build-droidvm-source-storage.py",
  # The display (scripts/build-droidvm-legacy-display.py): GopFramebuffer's owned backend under the original IOMobileFramebufferLegacy
  # of the fileset, presenting to the firmware framebuffer, and the key-store event service, as sheng's board builds them.
  "component:AppleKeyStoreState",
  # Metal over the virtio GPU (DroidVMGpu.cpp, scripts/build-droidvm-gpu.py as on iPadOS 17): NativeAdreno's user client, surface,
  # execbuf and memory, with the staged AGXAccelerator under the original IOGPUFamily of the fileset (build-adreno740-accelerator.py,
  # the reviewed 24A446 base). Its objects ride in the display archive. Adreno740 and AdrenoMetal are not components (that would
  # build sheng's whole GPU driver); their checkouts are linked into the tree first.
  "link-droidvm-gpu-sources.py",
  "build-droidvm-gpu.py",
  # Touch, keyboard and motion sensors (scripts/build-droidvm-hid-input.py): NativeHidInput under the original IOHIDDevice of the
  # fileset, fed by the app's virtio-input devices; its objects ride in the display archive as well.
  "build-droidvm-hid-input.py",
  # The network (IONetworkingFamily and the virtio-net controller), sound, battery and media devices (scripts/build-droidvm-devices.py),
  # in the display archive too.
  "build-droidvm-devices.py",
  "build-droidvm-legacy-display.py",
]

# The FAT volume of the boot disk (scripts/make-droidvm-disk.sh one level up adds UniXNU.efi and DarwinBoot.efi), as on iPadOS 17.
# The root policies of the OS and SystemOS disks (scripts/build-droidvm-root-policies.py, bundled by the source storage step)
# travel beside the kernel as kernel.macho.vroot, which DarwinBoot hands over as /chosen/memory-map RootPolicies: 117 MiB of block
# hashes for 24A446, hence the larger volume.
[payload]
volume = "DROIDVMESP"
size_mib = 320
loader = "driver"
title = "DroidVM: iPadOS 27.0.1"
# guest RAM of the 5120 MiB pseudo-unprotected VM with drm-host-mb=8, as the iPadOS 17 board's
dram_size = "0x13f200000"
root_policies = "{tree}/build/droidvm-source-storage/root-policies.bin"
kernel_args = [
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "tlto_us=0",
  # The switches the iPadOS 17 kernel has built in (package/DroidVMBootArgs.c), until this kernel links them too.
  "sheng-smp=1",
  "armcpu-self-ipi=1",
  "armcpu-spi-ipi=1",
  "native-source-storage=1",
  # The Data disk keeps what the system writes in the store window of the third virtio-mmio disk (package/DroidVMDataStore.c,
  # tools/rig/make-data-store.sh), not in RAM: a 2 GiB volatile Data held 781 MiB of it in guest RAM after one boot, and the GPU's
  # contiguous blob pages then found none free. The Data seed is the 12 GiB one (seed-data-grow.py --gib 12).
  "droidvm-data-persist=2",
  # The fileset puts this 4 KiB kernel's __TEXT at a 16 KiB boundary inside the collection's __PRELINK_TEXT: lockdown's
  # re-protection of __PRELINK_TEXT (arm_vm_prot_finalize) then sets the contiguous hint on a 64 KiB range whose pages __TEXT
  # mapped without it (arm_vm_init.c:1107). No hints until the emitter places native segments at 64 KiB.
  "use_contiguous_hint=0",
  # xnu-12377's DEVELOPMENT watchdogs of interrupt-masked and preemption-disabled time (iOS: 12000 timebase ticks, 625 us at
  # 19.2 MHz, then panic): a vCPU the host preempts holds both for as long as it is off its core (usermanagerd's first boot, 881 us).
  "interrupt-masked-debug-mode=0",
  "sched_preemption_disable_debug_mode=0",
  # Bring-up: the user exceptions of these processes go to the kernel log and sheng_exc_ring (the bring-up patch's exception.c).
  "sheng-exc-name=SpringBoard,backboardd,devicerecoverytool,liveactivitiesd,chronod",
  # The legacy display (bsd_init's native_mobile_graphics_load_probe, LegacyDisplayProbe.cpp): load the original graphics family and
  # register the owned GOP backend under it, as the iPadOS 17 kernel's built-in arguments do (package/DroidVMBootArgs.c), and the
  # key store events with the keybag of a guest without a passcode.
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=1",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-phase=4",
  "offline-legacy-unit-scale=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-key-events=1",
  # The HID device (HidInputProbe.cpp) with the Home button and touch, as package/DroidVMBootArgs.c, and the touch screen as a device
  # of its own (sheng-touch-split): iPadOS 27 serves HID through AppleUserHIDEventService, whose service keeps the combined device's
  # primary usage (Keyboard), and backboardd takes digitizer events only from a Digitizer/Touch Screen service.
  "offline-hid-input=1",
  "offline-hid-home=1",
  "sheng-touch-hid=1",
  "sheng-touch-split=1",
  "sheng-aks=1",
  "sheng-aks-sls=3",
  # The host's file mailbox (tools/rig export.py, crashes.py), answered by the droidvm-monitor worker.
  "droidvm-monitor=1000",
  # Metal's 3D through the virtio GPU's DRM context (drm2kgsl on the host), and the AGXAccelerator for Metal's discovery, as the
  # iPadOS 17 kernel's built-in arguments (package/DroidVMBootArgs.c).
  "vgpu-3d=1",
  "droidvm-gpu-metal=1",
  # The plugin's addon view over /System/Library/Extensions and LaunchDaemons (the Data seed's /private/var/ngpu, staged by the fork's
  # add-gpu-plugin-data.py --plugin build/adreno-metal-plugin27). The GPU clients and the other switches of iPadOS 17's built-in
  # arguments this board has are built in as well (package/DroidVMBootArgs27.c).
  "sheng-gpu-addon=1",
  # Fewer GPU clients than the built-in iPadOS 17 list for now: with all of them (14 clients, each priming its own pipelines) the
  # host's GPU memory took the phone to swap and it stopped answering for minutes. The list grows as the plugin's iPadOS 27
  # gaps close (the command line wins over the built-in value). The wallpaper takes the poster extensions (*Poster*) and
  # SBRendererService, PaperBoardUI's renderer, whose NeutrinoCore device asserts without a Metal device.
  "droidvm-gpu-clients=WidgetRenderer_Default,*Poster*,iconservicesagent,SBRendererService",
  "-v",
]

[payload.adt]
tool = "scripts/make-droidvm-adt.py"
dram_base = "0x80600000"
owned_memory_size = "0x20000000"
cpu_regs = "0,1,2,3"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"
chip_id = "8142"                     # iPad17,3 (the OS profile's [ipsw] chip_id 33090)
# The J820's identity from the IPSW's own device tree (unixnu ipsw fetch DeviceTree, copied to .cache/firmware here).
tool_args = ["--dynamic", "--boot-video-mib", "8", "--reclaim-memory", "--display-gamut", "sRGB",
             "--identity-tree", ".cache/firmware/DeviceTree.j820ap.im4p", "--kernel-ctrr-to-be-enabled", "0"]
